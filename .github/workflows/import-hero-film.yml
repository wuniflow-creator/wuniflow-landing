name: Importar vídeo Hero WuniFlow (12s)
on:
  push:
    branches: [feature/new-hero-film-20261109]
    paths: [.github/workflows/import-hero-film.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Baixar e otimizar o vídeo enviado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/cinematic
          curl --fail --location --retry 3 --silent --show-error \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3LsFGNctOOVbUlii5OlzOFjOTeY/5adc6f20-a491-49df-846c-60bc06857f97.mp4' \
            -o /tmp/wuniflow-hero-original.mp4
          test "$(stat -c %s /tmp/wuniflow-hero-original.mp4)" -gt 100000
          ffprobe -v error -show_entries stream=codec_name -of default=noprint_wrappers=1 /tmp/wuniflow-hero-original.mp4 | grep -q 'h264'
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/wuniflow-hero-original.mp4 \
            -t 12 -an -c:v libx264 -preset medium -crf 24 \
            -pix_fmt yuv420p -movflags +faststart \
            public/cinematic/wuniflow-hero-v4.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 0.8 \
            -i public/cinematic/wuniflow-hero-v4.mp4 -frames:v 1 \
            -c:v libwebp -quality 82 \
            public/cinematic/wuniflow-hero-v4-poster.webp
          test -s public/cinematic/wuniflow-hero-v4.mp4
          test -s public/cinematic/wuniflow-hero-v4-poster.webp
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 public/cinematic/wuniflow-hero-v4.mp4
      - name: Registrar os assets somente nesta branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/cinematic/wuniflow-hero-v4.mp4 public/cinematic/wuniflow-hero-v4-poster.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets: add optimized 12-second WuniFlow Hero V4 video and poster'
            git fetch origin feature/new-hero-film-20261109
            git rebase origin/feature/new-hero-film-20261109
            git push origin HEAD:feature/new-hero-film-20261109
          fi
