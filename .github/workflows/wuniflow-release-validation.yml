name: Wuniflow release validation

on:
  push:
    branches:
      - release/wuniflow-consolidado-final-20261111
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Build, SEO and regression contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript, Vite, SEO and commercial contracts
        run: npm run build
      - name: Install headless browser test dependencies
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser smoke (desktop and mobile)
        run: node scripts/verify-browser.mjs
