name: Generate Hero 180 high-quality scroll frames
on:
  push:
    branches: [feature/hero-canvas-scroll-180-20261109]
    paths: [.github/workflows/generate-hero-scroll-180.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate 180 WebP frames from current approved Hero V4
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3LsFGNctOOVbUlii5OlzOFjOTeY/cb65ce53-ef54-44a2-b404-675484bc2a9d.mp4' -o /tmp/hero-source-1080p.mp4
          test -s /tmp/hero-source-1080p.mp4
          mkdir -p public/cinematic/scroll-180
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/hero-source-1080p.mp4 \
            -vf "fps=15,scale=1920:-2:flags=lanczos" \
            -frames:v 180 -c:v libwebp -quality 87 -compression_level 5 \
            public/cinematic/scroll-180/frame_%03d.webp
          count=$(find public/cinematic/scroll-180 -type f -name 'frame_*.webp' | wc -l)
          test "$count" -eq 180
          echo "frames=$count"
          du -sh public/cinematic/scroll-180
      - name: Commit frames into feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/cinematic/scroll-180
          if ! git diff --cached --quiet; then
            git commit -m 'assets: 180 WebP frames for scroll-controlled WuniFlow Hero'
            git fetch origin feature/hero-canvas-scroll-180-20261109
            git rebase origin/feature/hero-canvas-scroll-180-20261109
            git push origin HEAD:feature/hero-canvas-scroll-180-20261109
          fi
